# Indexes user-analytics events into the user-analytics-report ES/OpenSearch index.
# Shared across modules; the first producer is im-services (SEM), which emits an event on
# every incident create/update (see SemAnalyticsService#publishEvent). Each Kafka message is
# a single flat UserAnalyticsEvent, so it is indexed as-is (id = event_id).
ServiceMaps:
  serviceName: User Analytics Report Indexer
  version: 1.0.0
  mappings:
    - topic: user-analytics-event
      configKey: INDEX
      indexes:
        - name: user-analytics-report
          type: general
          id: $.event_id
          jsonPath: $
          timeStampField: $.event_time
          fieldsToBeMasked:
            [
              "$.user.mobileNumber",
              "$.user.emailId",
            ]
          customJsonMapping:
            indexMapping:
              {
                "Data":
                  {
                    "event_id": "",
                    "event_type": "",
                    "event_time": "",
                    "application": "",
                    "user": {},
                    "system_role": "",
                    "primary_role": "",
                    "user_category": "",
                    "state": "",
                    "module": "",
                    "entity_id": "",
                    "entity_type": "",
                  },
              }
            fieldMapping:
              - inJsonPath: $.event_id
                outJsonPath: $.Data.event_id
              - inJsonPath: $.event_type
                outJsonPath: $.Data.event_type
              - inJsonPath: $.event_time
                outJsonPath: $.Data.event_time
              - inJsonPath: $.application
                outJsonPath: $.Data.application
              - inJsonPath: $.user
                outJsonPath: $.Data.user
              - inJsonPath: $.system_role
                outJsonPath: $.Data.system_role
              - inJsonPath: $.primary_role
                outJsonPath: $.Data.primary_role
              - inJsonPath: $.user_category
                outJsonPath: $.Data.user_category
              - inJsonPath: $.state
                outJsonPath: $.Data.state
              - inJsonPath: $.module
                outJsonPath: $.Data.module
              - inJsonPath: $.entity_id
                outJsonPath: $.Data.entity_id
              - inJsonPath: $.entity_type
                outJsonPath: $.Data.entity_type
              - inJsonPath: $.@timestamp
                outJsonPath: $.Data.@timestamp
